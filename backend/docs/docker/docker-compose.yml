services:
    backend:
        build:
            context: ../../
            dockerfile: docs/docker/Dockerfile
        # Aplica o esquema e os dados de exemplo (só se o banco estiver vazio) antes de subir a API.
        command: sh -c "python -m scripts.database.migrate && python -m scripts.database.seed && python run.py"
        ports:
            - "5000:5000"
        env_file:
            - ../../.env
        environment:
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ../../:/app

    db:
        image: postgres:16
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
